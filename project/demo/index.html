<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Effects Library - 网页效果库</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <h2>✨ Effects Lib</h2>
            </div>
            <nav class="category-nav">
                <ul id="category-list">
                    <!-- Categories injected by JS -->
                </ul>
            </nav>
            <div class="footer-info">
                <p>Designed for Developers</p>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="搜索效果 (e.g. Button, Card...)">
                </div>
                <div class="actions">
                    <a href="../../index.html" class="btn-back">返回首页</a>
                </div>
            </header>

            <div class="content-area">
                <div id="effects-grid" class="effects-grid">
                    <!-- Cards injected by JS -->
                </div>
                
                <div id="empty-state" class="empty-state" style="display: none;">
                    <p>👋 没有找到相关效果</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Preview Modal (Optional, for full view) -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Effect Title</h3>
                <button class="btn-close" id="btn-close-modal">×</button>
            </div>
            <div class="modal-body">
                <iframe id="preview-frame" src=""></iframe>
            </div>
            <div class="modal-footer">
                <a href="#" id="btn-view-source" target="_blank" class="btn-primary">查看源码</a>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
