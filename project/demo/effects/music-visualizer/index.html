<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐可视化</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
        }

        .visualizer {
            display: flex;
            align-items: flex-end;
            height: 200px;
            gap: 5px;
        }

        .bar {
            width: 15px;
            background: #e74c3c;
            animation: jump 1s ease-in-out infinite;
        }

        .bar:nth-child(odd) { background: #3498db; }
        .bar:nth-child(2n) { background: #9b59b6; }
        .bar:nth-child(3n) { background: #f1c40f; }

        @keyframes jump {
            0%, 100% { height: 10%; }
            50% { height: 100%; }
        }

        /* 设置不同的动画延迟，制造随机感 */
        .bar:nth-child(1) { animation-duration: 0.8s; }
        .bar:nth-child(2) { animation-duration: 1.2s; }
        .bar:nth-child(3) { animation-duration: 0.6s; }
        .bar:nth-child(4) { animation-duration: 1.0s; }
        .bar:nth-child(5) { animation-duration: 0.7s; }
        .bar:nth-child(6) { animation-duration: 1.1s; }
        .bar:nth-child(7) { animation-duration: 0.9s; }
        .bar:nth-child(8) { animation-duration: 1.3s; }
        .bar:nth-child(9) { animation-duration: 0.5s; }
        .bar:nth-child(10) { animation-duration: 1.4s; }
    </style>
</head>
<body>
    <div class="visualizer">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>
</body>
</html>
