<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环形加载器</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #262626;
        }

        .ring {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid transparent;
            border-top: 4px solid #fff000;
            animation: animate 2s linear infinite;
        }

        .ring::before {
            content: '';
            position: absolute;
            top: 12px;
            right: 12px;
            border-radius: 50%;
            width: 15px;
            height: 15px;
            background: #fff000;
            box-shadow: 0 0 0 5px rgba(255,255,0,0.15),
                        0 0 0 10px rgba(255,255,0,0.15),
                        0 0 0 20px rgba(255,255,0,0.15),
                        0 0 20px #fff000,
                        0 0 50px #fff000;
        }

        .text {
            position: absolute;
            color: #fff000;
            font-size: 20px;
            font-family: monospace;
            letter-spacing: 2px;
            animation: text 2s ease-in-out infinite;
        }

        @keyframes animate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes text {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="ring"></div>
    <span class="text">LOADING...</span>
</body>
</html>
