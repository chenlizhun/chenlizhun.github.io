<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交图标悬停</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #dcdde1;
        }

        ul {
            position: relative;
            display: flex;
            gap: 50px;
            padding: 0;
            margin: 0;
        }

        ul li {
            position: relative;
            list-style: none;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.5s;
        }

        ul li:hover {
            z-index: 10000;
            transform: scale(0.75);
        }

        ul li::before {
            content: '';
            position: absolute;
            inset: 30px;
            box-shadow: 0 0 0 10px var(--clr),
                        0 0 0 20px #f5f6fa,
                        0 0 0 22px var(--clr);
            border-radius: 50%;
            transition: 0.5s;
        }

        ul li:hover::before {
            inset: 0px;
            box-shadow: 0 0 0 10px var(--clr),
                        0 0 0 20px #f5f6fa,
                        0 0 0 22px var(--clr);
        }

        ul li::after {
            content: '';
            position: absolute;
            inset: 0;
            background: #f5f6fa;
            transform: rotate(45deg);
            border-radius: 20px;
        }

        ul li span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.2);
            color: var(--clr);
            font-size: 80px;
            text-transform: uppercase;
            opacity: 0;
            transition: 0.5s;
            z-index: 10;
        }

        ul li:hover span {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>
    <ul>
        <li style="--clr:#1877f2">
            <span>f</span>
        </li>
        <li style="--clr:#ff0000">
            <span>y</span>
        </li>
        <li style="--clr:#1da1f2">
            <span>t</span>
        </li>
    </ul>
</body>
</html>
