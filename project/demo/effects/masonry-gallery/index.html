<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瀑布流画廊</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #111;
            font-family: sans-serif;
        }

        .masonry {
            column-count: 4;
            column-gap: 20px;
        }

        .item {
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .item img {
            width: 100%;
            display: block;
            transition: transform 0.3s;
        }

        .item:hover img {
            transform: scale(1.1);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            opacity: 0;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .item:hover .overlay {
            opacity: 1;
        }

        @media (max-width: 900px) {
            .masonry { column-count: 3; }
        }
        @media (max-width: 600px) {
            .masonry { column-count: 2; }
        }
    </style>
</head>
<body>
    <div class="masonry">
        <div class="item">
            <img src="https://source.unsplash.com/random/400x500?sig=1" alt="">
            <div class="overlay">Image 1</div>
        </div>
        <div class="item">
            <img src="https://source.unsplash.com/random/400x300?sig=2" alt="">
            <div class="overlay">Image 2</div>
        </div>
        <div class="item">
            <img src="https://source.unsplash.com/random/400x600?sig=3" alt="">
            <div class="overlay">Image 3</div>
        </div>
        <div class="item">
            <img src="https://source.unsplash.com/random/400x400?sig=4" alt="">
            <div class="overlay">Image 4</div>
        </div>
        <div class="item">
            <img src="https://source.unsplash.com/random/400x350?sig=5" alt="">
            <div class="overlay">Image 5</div>
        </div>
        <div class="item">
            <img src="https://source.unsplash.com/random/400x550?sig=6" alt="">
            <div class="overlay">Image 6</div>
        </div>
        <div class="item">
            <img src="https://source.unsplash.com/random/400x450?sig=7" alt="">
            <div class="overlay">Image 7</div>
        </div>
        <div class="item">
            <img src="https://source.unsplash.com/random/400x320?sig=8" alt="">
            <div class="overlay">Image 8</div>
        </div>
    </div>
</body>
</html>
