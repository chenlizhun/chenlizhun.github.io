<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悬浮按钮菜单 (FAB)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ecf0f1;
        }

        .fab-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fab-btn {
            position: relative;
            width: 60px;
            height: 60px;
            background: #e74c3c;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 30px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            z-index: 10;
        }

        .menu {
            position: absolute;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 0;
            transition: 0.5s;
        }

        .menu li {
            position: absolute;
            left: 0;
            list-style: none;
            transition: 0.5s;
            transform-origin: 100px;
            transition-delay: calc(0.1s * var(--i));
            transform: rotate(0deg) translateX(0px);
        }

        .fab-container.active .menu li {
            transform: rotate(calc(360deg / 8 * var(--i))) translateX(0px);
        }
        
        /* 实际展开逻辑 */
        .fab-container.active .menu li a {
             transform: rotate(calc(360deg / -8 * var(--i)));
        }

        .menu li a {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 40px;
            height: 40px;
            background: #fff;
            border-radius: 50%;
            color: #e74c3c;
            box-shadow: 0 3px 4px rgba(0,0,0,0.15);
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        /* 简单版：直接垂直展开 */
        .simple-fab {
            position: fixed;
            bottom: 50px;
            right: 50px;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 20px;
        }

        .simple-fab .main-btn {
            width: 60px;
            height: 60px;
            background: #3498db;
            border-radius: 50%;
            color: white;
            font-size: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .simple-fab.active .main-btn {
            transform: rotate(45deg);
        }

        .simple-fab .sub-btn {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.3s;
            pointer-events: none;
        }

        .simple-fab.active .sub-btn {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .simple-fab.active .sub-btn:nth-child(2) { transition-delay: 0.05s; }
        .simple-fab.active .sub-btn:nth-child(3) { transition-delay: 0.1s; }
        .simple-fab.active .sub-btn:nth-child(4) { transition-delay: 0.15s; }

    </style>
</head>
<body>
    <div class="simple-fab" id="fab">
        <button class="main-btn" onclick="document.getElementById('fab').classList.toggle('active')">+</button>
        <button class="sub-btn">✎</button>
        <button class="sub-btn">❤</button>
        <button class="sub-btn">⌕</button>
    </div>
</body>
</html>
