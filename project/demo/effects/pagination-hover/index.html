<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>悬停分页</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
        }

        .pagination {
            display: flex;
            padding: 0;
            margin: 0;
        }

        .pagination li {
            list-style: none;
            margin: 0 5px;
        }

        .pagination li a {
            display: block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            background: #34495e;
            border-radius: 5px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            font-family: sans-serif;
            font-weight: bold;
        }

        .pagination li a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: 0.3s;
            z-index: -1;
        }

        .pagination li a:hover::before {
            left: 0;
        }
        
        .pagination li a:hover {
            color: white;
            z-index: 1;
        }
    </style>
</head>
<body>
    <ul class="pagination">
        <li><a href="#">Prev</a></li>
        <li><a href="#">1</a></li>
        <li><a href="#">2</a></li>
        <li><a href="#">3</a></li>
        <li><a href="#">4</a></li>
        <li><a href="#">5</a></li>
        <li><a href="#">Next</a></li>
    </ul>
</body>
</html>
