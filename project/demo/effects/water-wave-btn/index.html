<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水波纹按钮</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1f2f6;
            font-family: sans-serif;
        }

        .wave-btn {
            position: relative;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #3742fa;
            border: 2px solid #3742fa;
            background: transparent;
            cursor: pointer;
            border-radius: 50px;
            overflow: hidden;
            text-decoration: none;
            transition: 0.5s;
            z-index: 1;
        }

        .wave-btn:hover {
            color: white;
        }

        .wave-btn::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translate(-50%, 0);
            width: 300%;
            height: 300%;
            background-color: #3742fa;
            border-radius: 50%;
            transition: 0.8s;
            z-index: -1;
        }

        .wave-btn:hover::before {
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="#" class="wave-btn">Hover Me</a>
    </div>
</body>
</html>
