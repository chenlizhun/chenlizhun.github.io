<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>礼花按钮</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fff;
        }

        .confetti-btn {
            position: relative;
            padding: 15px 40px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
            transition: transform 0.1s;
        }

        .confetti-btn:active {
            transform: scale(0.95);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.4.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <button class="confetti-btn" onclick="fireConfetti()">Click Me!</button>

    <script>
        function fireConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
