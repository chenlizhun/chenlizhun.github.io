<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知堆栈</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 15px;
            transform: translateX(100%);
            animation: slideIn 0.5s forwards;
            border-left: 5px solid #2ecc71;
            min-width: 250px;
        }

        .notification.error {
            border-left-color: #e74c3c;
        }

        .notification-content h4 {
            margin: 0 0 5px 0;
            color: #333;
        }
        
        .notification-content p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }

        @keyframes slideIn {
            to { transform: translateX(0); }
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div>
        <button onclick="showNotification('success')">Show Success</button>
        <button onclick="showNotification('error')" style="background:#e74c3c">Show Error</button>
    </div>

    <div class="notification-container" id="container"></div>

    <script>
        function showNotification(type) {
            const container = document.getElementById('container');
            const notif = document.createElement('div');
            notif.classList.add('notification');
            if (type === 'error') notif.classList.add('error');

            const title = type === 'success' ? 'Success!' : 'Error!';
            const msg = type === 'success' ? 'Operation completed successfully.' : 'Something went wrong.';
            const icon = type === 'success' ? '✅' : '❌';

            notif.innerHTML = `
                <div style="font-size: 24px;">${icon}</div>
                <div class="notification-content">
                    <h4>${title}</h4>
                    <p>${msg}</p>
                </div>
            `;

            container.appendChild(notif);

            setTimeout(() => {
                notif.style.animation = 'slideIn 0.5s reverse forwards';
                setTimeout(() => notif.remove(), 500);
            }, 3000);
        }
    </script>
</body>
</html>
