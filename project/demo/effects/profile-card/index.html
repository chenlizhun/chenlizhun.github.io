<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交资料卡</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f1f2f6;
            font-family: sans-serif;
        }

        .profile-card {
            width: 300px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
        }

        .header {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            height: 120px;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 5px solid #fff;
            margin-top: -50px;
            background: url('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80') center/cover;
            display: inline-block;
        }

        .info {
            padding: 20px;
        }

        .info h2 { margin: 0; color: #333; }
        .info p { margin: 5px 0; color: #777; font-size: 14px; }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            border-top: 1px solid #eee;
        }

        .stat-item h3 { margin: 0; font-size: 18px; }
        .stat-item span { font-size: 12px; color: #777; }

        .btn {
            margin: 20px;
            padding: 10px 30px;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .btn:hover { background: #5849be; }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="header"></div>
        <div class="avatar"></div>
        <div class="info">
            <h2>John Doe</h2>
            <p>Web Developer</p>
            <button class="btn">Follow</button>
        </div>
        <div class="stats">
            <div class="stat-item">
                <h3>120</h3>
                <span>Posts</span>
            </div>
            <div class="stat-item">
                <h3>5k</h3>
                <span>Followers</span>
            </div>
            <div class="stat-item">
                <h3>200</h3>
                <span>Following</span>
            </div>
        </div>
    </div>
</body>
</html>
