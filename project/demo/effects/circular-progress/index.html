<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆形进度条</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2f3640;
            font-family: sans-serif;
        }

        .progress-card {
            position: relative;
            width: 250px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: #353b48;
            border-radius: 20px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.2);
        }

        .percent {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .percent svg {
            position: relative;
            width: 150px;
            height: 150px;
            transform: rotate(-90deg);
        }

        .percent svg circle {
            width: 150px;
            height: 150px;
            fill: none;
            stroke-width: 10;
            stroke: #2f3640;
            stroke-dasharray: 440;
            stroke-dashoffset: 440;
            stroke-linecap: round;
        }

        .percent svg circle:nth-child(1) {
            stroke-dashoffset: 0;
            stroke: #2f3640;
        }

        .percent svg circle:nth-child(2) {
            stroke-dashoffset: calc(440 - (440 * 85) / 100);
            stroke: #00a8ff;
            animation: progress 2s ease-out forwards;
        }

        .number {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .number h2 {
            font-size: 48px;
            margin: 0;
        }
        
        .number span {
            font-size: 24px;
        }

        .text {
            padding: 10px 0 0;
            color: #999;
            font-weight: 700;
            letter-spacing: 1px;
        }

        @keyframes progress {
            0% { stroke-dashoffset: 440; }
            100% { stroke-dashoffset: calc(440 - (440 * 85) / 100); }
        }
    </style>
</head>
<body>
    <div class="progress-card">
        <div class="percent">
            <svg>
                <circle cx="70" cy="70" r="70"></circle>
                <circle cx="70" cy="70" r="70"></circle>
            </svg>
            <div class="number">
                <h2>85<span>%</span></h2>
            </div>
        </div>
        <h2 class="text">Loading...</h2>
    </div>
</body>
</html>
