<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动画搜索框</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50;
        }

        .search-box {
            position: relative;
            background: #fff;
            height: 60px;
            border-radius: 50px;
            padding: 10px;
            display: flex;
            align-items: center;
            transition: 0.5s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .search-box:hover {
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
        }

        .search-txt {
            border: none;
            background: none;
            outline: none;
            padding: 0;
            color: #333;
            font-size: 16px;
            transition: 0.4s;
            line-height: 40px;
            width: 0px;
        }

        .search-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #2f3640;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            transition: 0.4s;
        }

        .search-box:hover .search-txt {
            width: 240px;
            padding: 0 10px;
        }

        .search-box:hover .search-btn {
            background: #fff;
            color: #2f3640;
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="search-box">
        <input class="search-txt" type="text" name="" placeholder="Type to search">
        <a class="search-btn" href="#">
            <i class="fas fa-search"></i>
        </a>
    </div>
</body>
</html>
