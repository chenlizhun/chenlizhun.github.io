<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流动渐变边框</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0e1538;
            font-family: sans-serif;
        }

        .gradient-card {
            position: relative;
            width: 300px;
            height: 400px;
            background: #060c21;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            overflow: hidden;
        }

        .gradient-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 300px;
            height: 400px;
            background: linear-gradient(0deg, transparent, #45f3ff, #45f3ff);
            transform-origin: bottom right;
            animation: animate 6s linear infinite;
        }

        .gradient-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 300px;
            height: 400px;
            background: linear-gradient(0deg, transparent, #ff2770, #ff2770);
            transform-origin: bottom right;
            animation: animate 6s linear infinite;
            animation-delay: -3s;
        }

        @keyframes animate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .content {
            position: absolute;
            inset: 4px;
            background: #0e1538;
            z-index: 10;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h2 {
            font-size: 2em;
            margin-bottom: 10px;
            color: #45f3ff;
        }
        
        p {
            font-size: 1.1em;
            line-height: 1.6;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #45f3ff;
            color: #0e1538;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #ff2770;
            color: white;
            box-shadow: 0 0 10px #ff2770;
        }
    </style>
</head>
<body>
    <div class="gradient-card">
        <div class="content">
            <h2>Magic Border</h2>
            <p>使用伪元素旋转动画配合 inset 属性实现的流动渐变边框效果。</p>
            <a href="#" class="btn">Learn More</a>
        </div>
    </div>
</body>
</html>
