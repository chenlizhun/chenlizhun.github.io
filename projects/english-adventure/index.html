<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Adventure 🏰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for fun typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Auth SDK Integration (Optional but recommended for consistency) -->
    <script src="https://imgcache.qq.com/qcloud/tcbjs/1.3.5/tcb.js"></script>
    <script src="../common/auth-sdk.js"></script> 
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounce 0.5s infinite',
                        'wiggle': 'wiggle 0.5s ease-in-out infinite',
                        'pop': 'pop 0.3s ease-out forwards',
                    },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="text-gray-800 h-screen flex flex-col bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 selection:bg-brand-primary selection:text-white select-none touch-manipulation font-sans">

    <!-- Navbar -->
    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="../edutogatherhome/index.html" class="flex items-center gap-2 transition-opacity hover:opacity-80">
                    <img src="../edutogatherhome/logo.png" class="h-8 w-auto drop-shadow-sm">
                    <span class="font-extrabold text-xl tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-brand-primary to-brand-accent">
                        Edutogather
                    </span>
                </a>
            </div>
            <div class="flex items-center gap-3">
                 <div class="flex items-center gap-2 text-sm font-medium text-gray-600 bg-gray-50 px-3 py-1 rounded-full border border-gray-200">
                    <span class="text-lg">🏰</span>
                    <span class="hidden md:inline">English Adventure</span>
                 </div>
                 <!-- User Status Widget -->
                 <div id="user-status-widget" class="hidden md:flex items-center gap-2 text-sm font-medium text-gray-600 bg-gray-50 px-3 py-1 rounded-full border border-gray-200">
                    <span class="w-2 h-2 rounded-full bg-green-400"></span>
                    <span id="header-user-name">Guest</span>
                 </div>
            </div>
        </div>
    </nav>

    <div id="app" class="flex-1 flex flex-col w-full relative max-w-md md:max-w-4xl lg:max-w-5xl mx-auto px-4 md:px-8">
        <!-- Views will be rendered here by JS -->
    </div>

    <!-- Audio Elements (Preload if needed, though we use SpeechSynthesis mostly) -->
    
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
