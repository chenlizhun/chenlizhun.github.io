<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Adventure 🏰</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for fun typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Auth SDK Integration (Optional but recommended for consistency) -->
    <script src="../common/auth-sdk.js"></script> 
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fredoka', 'sans-serif'],
                    },
                    animation: {
                        'bounce-short': 'bounce 0.5s infinite',
                        'wiggle': 'wiggle 0.5s ease-in-out infinite',
                        'pop': 'pop 0.3s ease-out forwards',
                    },
                    keyframes: {
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-sky-50 font-sans select-none text-slate-800 touch-manipulation">
    
    <!-- Background Decorations -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-64 h-64 bg-yellow-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
        <div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-pink-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-80 h-80 bg-purple-200 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>
    </div>

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col relative">
        <!-- Views will be rendered here by JS -->
    </div>

    <!-- Audio Elements (Preload if needed, though we use SpeechSynthesis mostly) -->
    
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
