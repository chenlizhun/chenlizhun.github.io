<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathHero - 口算小英雄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-yellow-50 h-screen flex flex-col overflow-hidden select-none font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm px-6 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <a href="../edutogatherhome/index.html" class="text-gray-500 hover:text-yellow-600 transition flex items-center gap-1 font-bold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                返回
            </a>
            <div class="h-6 w-px bg-gray-200 mx-2"></div>
            <h1 class="text-xl font-extrabold text-yellow-500 tracking-tight flex items-center gap-2">
                <span>🧮</span> MathHero
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="sound-toggle" class="p-2 rounded-full bg-gray-100 text-gray-400 hover:bg-yellow-100 hover:text-yellow-500 transition">
                <!-- Speaker Icon -->
                <svg id="icon-sound-on" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                <svg id="icon-sound-off" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
            </button>
            <span id="user-display" class="text-xs font-bold text-gray-400 bg-gray-100 px-3 py-1 rounded-full">访客</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-4 relative">
        
        <!-- Game Container -->
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border-4 border-yellow-200 relative">
            
            <!-- Top Bar: Score & Mode -->
            <div class="bg-yellow-100 p-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="text-yellow-600 font-bold text-sm uppercase">Score</span>
                    <span id="score-display" class="bg-white px-3 py-1 rounded-full text-yellow-600 font-mono font-bold text-xl shadow-inner">0</span>
                </div>
                <select id="mode-selector" class="text-xs font-bold text-yellow-700 bg-yellow-200 border-none rounded-lg py-1 px-2 focus:ring-2 focus:ring-yellow-400 outline-none cursor-pointer">
                    <option value="10">10以内加减</option>
                    <option value="20">20以内加减</option>
                    <option value="20_carry">20以内进退位</option>
                </select>
            </div>

            <!-- Question Area -->
            <div class="p-8 text-center bg-white min-h-[200px] flex flex-col justify-center items-center relative">
                <div id="combo-display" class="absolute top-2 right-4 text-orange-500 font-bold italic opacity-0 transition-all transform scale-50">Combo x1!</div>
                
                <div id="question-box" class="text-6xl font-black text-gray-800 tracking-wider mb-2 transition-transform duration-100">
                    <!-- 5 + 3 = ? -->
                    <span id="num1">?</span>
                    <span id="operator" class="text-yellow-500 mx-2">+</span>
                    <span id="num2">?</span>
                    <span class="mx-2">=</span>
                    <span id="answer-placeholder" class="text-blue-500 border-b-4 border-blue-200 min-w-[1.5em] inline-block">?</span>
                </div>
                
                <div id="feedback-msg" class="h-6 text-sm font-bold text-gray-400 mt-4">准备好了吗？</div>

                <!-- History Log (Last 3) -->
                <div id="history-log" class="absolute bottom-2 left-0 right-0 flex justify-center gap-2 opacity-50 text-[10px] text-gray-400 font-mono">
                    <!-- <span>5+3=8</span> -->
                </div>
            </div>

            <!-- Keypad -->
            <div class="bg-gray-50 p-4 grid grid-cols-3 gap-3">
                <button class="key-btn" data-val="1">1</button>
                <button class="key-btn" data-val="2">2</button>
                <button class="key-btn" data-val="3">3</button>
                <button class="key-btn" data-val="4">4</button>
                <button class="key-btn" data-val="5">5</button>
                <button class="key-btn" data-val="6">6</button>
                <button class="key-btn" data-val="7">7</button>
                <button class="key-btn" data-val="8">8</button>
                <button class="key-btn" data-val="9">9</button>
                <button class="key-btn text-red-400" data-action="clear">C</button>
                <button class="key-btn" data-val="0">0</button>
                <button class="key-btn bg-blue-500 text-white shadow-blue-300 active:shadow-none active:translate-y-1" data-action="submit">OK</button>
            </div>
        </div>

        <!-- Start Overlay -->
        <div id="start-overlay" class="absolute inset-0 bg-yellow-50/90 backdrop-blur-sm flex items-center justify-center z-20">
            <div class="text-center">
                <div class="text-6xl mb-4 animate-bounce">🧮</div>
                <h2 class="text-3xl font-black text-yellow-600 mb-2">口算小英雄</h2>
                <p class="text-gray-500 mb-8">准备好挑战你的数学能力了吗？</p>
                <button id="start-btn" class="bg-yellow-500 hover:bg-yellow-400 text-white text-xl font-bold py-4 px-12 rounded-full shadow-xl transition transform hover:scale-105 active:scale-95">
                    开始挑战
                </button>
            </div>
        </div>

    </main>

    <!-- Shared Auth SDK -->
    <script src="../common/cloudbase.js"></script>
    <script src="../common/auth-sdk.js?v=20260127"></script>
    <script src="js/app.js?v=20260127"></script>
</body>
</html>
